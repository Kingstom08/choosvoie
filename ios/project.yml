name: ChoosVoie
options:
  bundleIdPrefix: com.kingstom08
  deploymentTarget:
    iOS: "26.0"
packages:
  ChoosVoieCore:
    path: ChoosVoieCore
targets:
  ChoosVoie:
    type: application
    platform: iOS
    sources:
      - ChoosVoie
    dependencies:
      - package: ChoosVoieCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kingstom08.choosvoie
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XJV627YJ69
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "ChoosVoie, dublaj kaydı yapmak için mikrofona erişmek ister."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "ChoosVoie, konuşmayı metne çevirmek için konuşma tanımayı kullanır."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  ChoosVoie:
    build:
      targets:
        ChoosVoie: all
    run:
      config: Debug
